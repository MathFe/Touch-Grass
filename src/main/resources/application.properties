spring.application.name=duelo-de-fotos

# A app só atende o próprio computador.
server.address=127.0.0.1

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma3:4b
spring.ai.ollama.chat.options.temperature=0.2

# O padrão do Spring AI repete a chamada várias vezes; com o Ollama fechado isso trava a página.
# No Spring AI 2.0 este número conta as repetições: 1 ainda faz duas chamadas, 0 faz uma só.
spring.ai.retry.max-attempts=0
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=120s

# Este logger imprime a exceção inteira a cada falha, e a mensagem pode citar o que foi enviado ao modelo.
logging.level.org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration=ERROR

# Fotos de celular passam fácil do limite padrão de 1 MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=250MB
# Sem isto o Tomcat derruba a conexão quando a foto passa do limite, e a mensagem de erro não chega ao navegador.
server.tomcat.max-swallow-size=-1
